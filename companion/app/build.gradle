plugins {
    id 'com.android.application'
}

android {
    namespace 'com.companion.tvmirror'
    compileSdk 34

    defaultConfig {
        applicationId "com.companion.tvmirror"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        resourceConfigurations += ['en']
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
        }
    }

    packaging {
        resources {
            excludes += [
                'META-INF/**',
                'kotlin/**',
                'DebugProbesKt.bin'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure Android platform APIs only: zero external dependencies for maximum performance & micro APK size.
}
